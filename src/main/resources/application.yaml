spring:
  codec:
    max-in-memory-size: 1TB
  application:
    name: cnpj-analyzr-spring-app
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASS}
    driver-class-name: org.postgresql.Driver
management:
  endpoints:
    web:
      cors:
        allowed-origins: '*'
        allowed-methods: GET,POST

owner-email: viniciusbaleia1999@gmail.com

mailgun:
  url: ${MAILGUN_URL:test}
  apiKey: ${MAILGUN_APIKEY:test}
  # email to be the host of the email sent by the service
  hostFrom: ${MAILGUN_HOST_FROM:ItiMenu <support@itimenu.app>}

